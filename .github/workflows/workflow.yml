
name: CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install flake8 nose

      - name: Lint with flake8
        run: flake8 calculator.py test_calculator.py

      - name: Run unit tests with nose
        run: nosetests -v
