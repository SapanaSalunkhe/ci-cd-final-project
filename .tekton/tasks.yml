
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: python:3.10-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        rm -rf __pycache__ .pytest_cache
        echo "Cleanup completed"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.10-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        python -m pip install flake8 nose
        flake8 calculator.py test_calculator.py
        nosetests -v
